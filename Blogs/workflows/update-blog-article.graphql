mutation UpdateBlogArticle($id: ID!, $article: ArticleUpdateInput!) {
  articleUpdate(id: $id, article: $article) {
    article {
      id
      title
      handle
      isPublished
      publishedAt
      tags
      summary
      body
      blog {
        id
        title
        handle
      }
    }
    userErrors {
      field
      message
    }
  }
}
